name: release

# Tag a commit v<version> (matching extension/manifest.json) and this builds the Chrome store zip and the Safari
# folder zip and attaches both to a GitHub Release. A v<version>-dev.<sha> tag does the same as a pre-release.
# The upload to the Chrome Web Store, and the Xcode wrap for Safari, stay manual.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run typecheck && npm test
      - name: Check the tag matches the manifest version
        id: tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          case "${GITHUB_REF_NAME}" in
            "v$v") echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
            "v$v-dev."*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "tag ${GITHUB_REF_NAME} but manifest is $v"; exit 1 ;;
          esac
      - run: npm run package
      - run: npm run package:safari
      - uses: softprops/action-gh-release@v2
        with:
          files: extension/wordsnap-*.zip
          prerelease: ${{ steps.tag.outputs.prerelease }}
          generate_release_notes: true
