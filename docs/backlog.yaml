# Feature ideas and enhancements, newest first. Status: idea | planned | in-progress | done | dropped.

- id: check-stage
  title: Check stage, Facts and Challenge after the co-writer
  status: planned
  summary: >
    The fourth stage in Tune · Shape · Tweak · Check, shown as "soon" in the co-writer release. Facts runs pass A
    in a claims-only mode (new PassClaims schema, low effort, no clarity notes) and then pass B per claim; Challenge is
    pass C, which also takes over unsupported leaps from the dropped clarity notes. Each runs only on its own button.
    The old passes are deleted by the co-writer's clean slate; this gets its own design, and git history (before the
    co-writer lands) has passes A, B and C if they are worth mining.
  depends_on: cowriter
  refs: [docs/cowriter-design.md]

- id: cowriter
